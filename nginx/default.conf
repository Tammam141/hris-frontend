server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Dipakai Docker healthcheck dan scripts/deploy.sh
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # File di /assets memiliki hash di namanya (index-CtzQCu4d.js), jadi
    # aman di-cache setahun. Versi baru selalu bernama berbeda
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Manifest PWA. Content-Type ditetapkan manual karena mime.types bawaan
    # image ini belum mengenal .webmanifest
    location = /manifest.webmanifest {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Service worker tidak boleh di-cache. Kalau ter-cache, pengguna PWA
    # tidak pernah menerima versi baru
    location ~* ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Routing SPA: semua path yang bukan file (/dashboard, /leave/history,
    # /reset-password?...) diarahkan ke index.html dan diurus React Router
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}

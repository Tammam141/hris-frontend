add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Content Security Policy (mitigasi XSS)
# - script-src 'self'      : hanya JS hasil build yang boleh jalan (tanpa inline/eval)
# - style-src 'unsafe-inline': dibutuhkan tag <style> keyframes di beberapa komponen React
# - connect-src          : hanya origin sendiri + API & WebSocket produksi
#                            Jika domain API berubah, ubah juga di sini.
# - img-src blob: data:    : preview upload foto/gambar
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.hris.click wss://api.hris.click; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

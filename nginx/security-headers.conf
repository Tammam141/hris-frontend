# Security headers (di-include dari default.conf)

# Browser tidak boleh menebak tipe file
add_header X-Content-Type-Options "nosniff" always;

# Dilarang di-embed di iframe (anti-clickjacking)
add_header X-Frame-Options "DENY" always;

# Ke situs lain hanya kirim origin, bukan URL lengkap
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Matikan kamera, mikrofon, dan lokasi
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# CSP: batasi sumber yang boleh dimuat browser (mitigasi XSS)
#   default-src 'self'   -> default: hanya domain sendiri
#   script-src 'self'    -> JS hanya dari file build (inline/eval diblokir)
#   style-src            -> CSS sendiri + inline (ada tag <style> di React)
#   img-src              -> gambar sendiri, data:, blob: (preview upload), https:
#   font-src             -> font sendiri / data:
#   connect-src          -> API & WebSocket hanya ke api.hris.click (ubah jika domain berubah)
#   manifest/worker-src  -> PWA & service worker hanya dari domain sendiri
#   object-src 'none'    -> plugin <object>/<embed> dilarang
#   base-uri, form-action-> dikunci ke domain sendiri
#   frame-ancestors none -> tidak boleh di-embed di frame
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.hris.click wss://api.hris.click; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

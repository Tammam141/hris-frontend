<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HRIS Frontend</title>

    <!-- [PWA Meta Tags] Pengaturan tampilan dan instalasi Progressive Web App -->
    <meta name="theme-color" content="#0b5796" /> <!-- [PWA] Warna status bar mobile disesuaikan dengan warna logo baru -->
    <meta name="description" content="Human Resource Information System" /> <!-- [PWA] Deskripsi aplikasi -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" /> <!-- [PWA] Icon saat ditambahkan ke Home Screen di iOS Safari (Apple) -->
    <meta name="apple-mobile-web-app-capable" content="yes" /> <!-- [PWA] Menjalankan mode fullscreen / standalone di perangkat iOS -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" /> <!-- [PWA] Gaya status bar di iOS -->
    <meta name="apple-mobile-web-app-title" content="HRIS" /> <!-- [PWA] Nama aplikasi di iOS homescreen -->
  </head>
  <body>
    <div id="root"></div>
    <div id="error-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); color: white; padding: 20px; z-index: 9999; overflow: auto; font-family: monospace;">
      <h2 style="color: #f87171;">Runtime Error</h2>
      <pre id="error-msg" style="white-space: pre-wrap; word-wrap: break-word;"></pre>
    </div>
    <script>
      window.addEventListener('error', function(event) {
        document.getElementById('error-overlay').style.display = 'block';
        document.getElementById('error-msg').innerText = event.error ? event.error.stack : event.message;
      });
      window.addEventListener('unhandledrejection', function(event) {
        document.getElementById('error-overlay').style.display = 'block';
        document.getElementById('error-msg').innerText = event.reason ? event.reason.stack : event.reason;
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
